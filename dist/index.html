  <div id="app"></div>
  <script>
    (function () {
      var KEY = 'leop2p_use_author_relay';
      // Default OFF
      if (localStorage.getItem(KEY) === null) {
        localStorage.setItem(KEY, '0');
      }

      function isOn() {
        return localStorage.getItem(KEY) === '1';
      }

      function buildItem() {
        var wrap = document.createElement('div');
        wrap.className = 'leop2p-perm-item permission-item';
        wrap.setAttribute('data-leop2p-relay', '1');
        var on = isOn();
        wrap.innerHTML =
          '<label class="leop2p-perm-row">' +
          '<input type="checkbox" ' + (on ? 'checked' : '') + ' />' +
          '<span>使用增强穿透（第三方 STUN/TURN）</span>' +
          '</label>' +
          '<div class="permission-desc">开启后会请求第三方穿透服务，可改善跨网连接；默认关闭。修改后需重新连接。</div>';
        var cb = wrap.querySelector('input');
        cb.addEventListener('change', function () {
          localStorage.setItem(KEY, cb.checked ? '1' : '0');
          // Soft notice — full effect on next peer init / reload
          var tip = wrap.querySelector('.permission-desc');
          if (tip) {
            tip.textContent = cb.checked
              ? '已开启。请断开并重新连接（或刷新页面）后生效。'
              : '已关闭。请断开并重新连接（或刷新页面）后生效。';
          }
        });
        return wrap;
      }

      function injectIntoPermissionDialog() {
        var containers = document.querySelectorAll('.permission-container');
        containers.forEach(function (box) {
          if (box.querySelector('[data-leop2p-relay]')) return;
          box.appendChild(buildItem());
        });
      }

      // Watch for Ant Design modal open
      var obs = new MutationObserver(function () {
        injectIntoPermissionDialog();
      });
      obs.observe(document.documentElement, { childList: true, subtree: true });

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', injectIntoPermissionDialog);
      } else {
        injectIntoPermissionDialog();
      }
      // Also poll lightly for first few seconds after mount
      var n = 0;
      var t = setInterval(function () {
        injectIntoPermissionDialog();
        if (++n > 20) clearInterval(t);
      }, 500);
    })();
  </script>
